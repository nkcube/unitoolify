<div class="card">
  <div class="flex justify-between items-center">
    <label for="inputText" class="text-lg font-semibold md:text-xl"
      >Input</label
    >
  </div>
  <textarea
    spellcheck="false"
    autocomplete="off"
    id="inputText"
    name="inputText"
    class="textarea"
    placeholder="e.g. &lt;p&gt;Fish &amp;amp; chips&lt;/p&gt;"
  ></textarea>

  <div class="flex flex-col gap-3">
    <label class="flex flex-col gap-1 text-sm text-slate-400">
      <span>Mode</span>
      <select id="mode" name="mode" class="select">
        <option value="text">Text — escape &amp;, &lt; and &gt;</option>
        <option value="attribute">Attribute value — also escape quotes</option>
        <option value="nonascii">All non-ASCII — numeric entities too</option>
      </select>
    </label>
    <label class="check">
      <input
        type="checkbox"
        id="liveMode"
        name="liveMode"
        checked
        class="accent-primary"
      />
      Live mode (encode as you type)
    </label>
  </div>

  <button class="btn btn-primary btn-block" id="actionBtn" type="button">
    Encode HTML
  </button>
</div>

<div class="card">
  <div class="flex justify-between items-center">
    <label for="outputText" class="text-lg font-semibold md:text-xl"
      >Output</label
    >
    <button class="btn btn-ghost btn-sm" id="copyBtn" type="button">
      Copy
    </button>
  </div>
  <textarea
    spellcheck="false"
    autocomplete="off"
    id="outputText"
    name="outputText"
    readonly
    class="textarea"
    placeholder="Encoded HTML will appear here…"
  ></textarea>
</div>
