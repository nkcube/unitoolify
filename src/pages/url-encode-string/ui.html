<div class="card">
  <div class="flex justify-between items-center">
    <label for="inputText" class="text-lg font-semibold md:text-xl"
      >Input</label
    >
  </div>
  <textarea
    spellcheck="false"
    autocomplete="off"
    id="inputText"
    name="inputText"
    class="textarea"
    placeholder="e.g. hello world & 你好/世界"
  ></textarea>

  <div class="flex flex-col gap-3">
    <label class="flex flex-col gap-1 text-sm text-slate-400">
      <span>Mode</span>
      <select id="mode" name="mode" class="select">
        <option value="component">
          Component — query value or path segment
        </option>
        <option value="strict">RFC 3986 strict — also encodes ! ' ( ) *</option>
        <option value="uri">Full URL — keeps : / ? # &amp; =</option>
        <option value="form">Form body — space becomes +</option>
      </select>
    </label>
    <label class="check">
      <input
        type="checkbox"
        id="liveMode"
        name="liveMode"
        checked
        class="accent-primary"
      />
      Live mode (encode as you type)
    </label>
  </div>

  <button class="btn btn-primary btn-block" id="actionBtn" type="button">
    Encode String
  </button>
</div>

<div class="card">
  <div class="flex justify-between items-center">
    <label for="outputText" class="text-lg font-semibold md:text-xl"
      >Output</label
    >
    <button class="btn btn-ghost btn-sm" id="copyBtn" type="button">
      Copy
    </button>
  </div>
  <textarea
    spellcheck="false"
    autocomplete="off"
    id="outputText"
    name="outputText"
    readonly
    class="textarea"
    placeholder="Result will appear here…"
  ></textarea>
</div>
