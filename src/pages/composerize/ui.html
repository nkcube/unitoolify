<div class="card">
  <div class="flex justify-between items-center">
    <label for="inputText" class="text-lg font-semibold md:text-xl"
      >Docker Run Command</label
    >
  </div>
  <textarea
    spellcheck="false"
    autocomplete="off"
    id="inputText"
    name="inputText"
    class="textarea"
    placeholder="Paste your `docker run ...` command here…&#10;&#10;Example:&#10;docker run -p 80:80 -v /var/run/docker.sock:/tmp/docker.sock:ro --restart always --log-opt max-size=1g nginx"
  ></textarea>

  <label class="check">
    <input
      type="checkbox"
      id="liveMode"
      name="liveMode"
      checked
      class="accent-primary"
    />
    Live mode (convert as you type)
  </label>

  <button class="btn btn-primary btn-block" id="convertBtn" type="button">
    Convert to Compose
  </button>
</div>

<div class="card">
  <div class="flex justify-between items-center">
    <label for="outputText" class="text-lg font-semibold md:text-xl">
      Docker Compose YAML
    </label>
    <div class="flex gap-2">
      <button class="btn btn-ghost btn-sm" id="copyBtn" type="button">
        Copy
      </button>
      <button class="btn btn-ghost btn-sm" id="downloadBtn" type="button">
        Download
      </button>
    </div>
  </div>
  <textarea
    spellcheck="false"
    autocomplete="off"
    id="outputText"
    name="outputText"
    readonly
    class="textarea"
    placeholder="Your docker-compose.yml output will appear here…"
  ></textarea>
  <p
    id="meta"
    class="text-xs text-slate-400"
    role="status"
    aria-live="polite"
  ></p>
</div>
