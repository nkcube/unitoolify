<div class="card">
  <div class="flex justify-between items-center">
    <label for="inputText" class="text-lg md:text-xl font-semibold"
      >Input JSON</label
    >
  </div>
  <textarea
    aria-describedby="errorMsg"
    spellcheck="false"
    autocomplete="off"
    id="inputText"
    name="inputText"
    class="textarea"
    placeholder="Paste your raw JSON here…"
  ></textarea>
  <div class="error-msg" id="errorMsg" role="status" aria-live="polite"></div>

  <div class="flex flex-col gap-2">
    <label class="check">
      <input
        type="checkbox"
        id="liveMode"
        name="liveMode"
        checked
        class="accent-primary"
      />
      Live mode (format as you type)
    </label>
    <label class="check">
      Indent space:
      <select id="indentSpace" name="indentSpace" class="select">
        <option value="2">2 Spaces</option>
        <option value="4">4 Spaces</option>
        <option value="tab">Tab</option>
      </select>
    </label>
  </div>

  <button class="btn btn-primary btn-block" id="formatBtn">Format JSON</button>
</div>

<div class="card">
  <div class="flex justify-between items-center">
    <label for="outputText" class="text-lg md:text-xl font-semibold"
      >Formatted JSON</label
    >
    <div class="flex gap-2">
      <button class="btn btn-ghost btn-sm" id="copyBtn">Copy</button>
      <button class="btn btn-ghost btn-sm" id="downloadBtn">Download</button>
    </div>
  </div>
  <textarea
    spellcheck="false"
    autocomplete="off"
    id="outputText"
    name="outputText"
    readonly
    class="textarea"
    placeholder="Formatted result will appear here…"
  ></textarea>
  <p
    id="meta"
    class="text-xs text-slate-400"
    role="status"
    aria-live="polite"
  ></p>
</div>
