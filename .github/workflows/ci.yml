name: CI Checks

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  link-checker:
    name: Broken Link Checker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      
      - name: Run Lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose --no-progress --root-dir . './**/*.html' './**/*.md'
          fail: true

  html-lint:
    name: HTML Linter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          
      - name: Install HTMLHint
        run: npm install -g htmlhint
        
      - name: Run HTMLHint
        run: htmlhint "**/*.html" --ignore "yandex_*.html,google*.html"

  format-check:
    name: Prettier Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          
      - name: Install Prettier
        run: npm install -g prettier
        
      - name: Check Formatting
        run: prettier --check "**/*.{html,js,css,md}"

  spell-check:
    name: Spell Checker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        
      - name: Run CSpell
        uses: streetsidesoftware/cspell-action@v9
        with:
          files: '**/*.{html,md,js,css}'
