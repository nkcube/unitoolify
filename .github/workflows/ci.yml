name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      # Generated HTML/CSS/images are committed, so a stale build is a bug.
      - name: Build everything
        run: npm run build:all

      - name: Fail if generated output differs from source
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Generated files are out of date. Run npm run build:all and commit the result."
            git status --porcelain
            git --no-pager diff --stat
            exit 1
          fi

  lint:
    name: HTML, format and spelling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - run: npm ci
      - run: npm run lint:html
      - run: npm run lint:format
      - run: npm run lint:spell

  links:
    name: Broken links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Internal links and canonicals are asserted by tests/quality.spec.mjs
      # against the built site, so this job only has to chase outside URLs.
      - uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose --no-progress --root-dir . --exclude-path node_modules
            --exclude-path .workbuddy --exclude '^https://www\.unitoolify\.com'
            --accept 200,206,429 './**/*.html' './**/*.md'
          fail: true

  test:
    name: Behaviour and accessibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
